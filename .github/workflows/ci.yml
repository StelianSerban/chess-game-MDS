name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsfml-dev \
            libgtest-dev \
            g++

      - name: Build tests
        run: make run_tests

      - name: Run tests
        run: ./run_tests --gtest_output=xml:test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Build app
        run: make app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-linux
          path: app

  release:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev libgtest-dev g++

      - name: Build app
        run: make app

      - name: Get short SHA
        id: slug
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.slug.outputs.sha }}
          name: "Build ${{ steps.slug.outputs.sha }}"
          body: "Automatic build from commit ${{ github.sha }}"
          files: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}